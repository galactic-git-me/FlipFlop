<h2>Delivery or collection?</h2>
<p class="subtitle">How does the customer receive their built PC?</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Delivery only</h3>
      <p>You ship it. Customer provides address at checkout.</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Collection only</h3>
      <p>Customer picks it up from you.</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Both — customer's choice</h3>
      <p>Pick delivery or collection at checkout.</p>
    </div>
  </div>
</div>
