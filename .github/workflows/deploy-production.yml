name: Deploy production to Andromeda

on:
  # Every commit promoted to main deploys the API and storefront together.
  # Development/autosync branches remain excluded from production.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flipflop-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: disabled-in-ci
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
    defaults:
      run:
        working-directory: flipflop-api
    steps:
      - uses: actions/checkout@v5
      - name: Require production branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment must be dispatched from main (received ${{ github.ref }})."
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flipflop-api/requirements*.txt
      - name: Install API dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      - name: Verify eBay OAuth and price alerts
        run: >-
          python -m pytest -q
          tests/test_ebay_oauth.py
          tests/test_component_price_alert_matching.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.ANDROMEDA_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/andromeda
          chmod 600 ~/.ssh/andromeda
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy API and storefront together
        env:
          ANDROMEDA_HOST: ${{ secrets.ANDROMEDA_HOST }}
          ANDROMEDA_USER: ${{ secrets.ANDROMEDA_USER }}
          ANDROMEDA_PORT: ${{ secrets.ANDROMEDA_PORT }}
        run: |
          ssh -i ~/.ssh/andromeda \
            -p "${ANDROMEDA_PORT:-22}" \
            "$ANDROMEDA_USER@$ANDROMEDA_HOST" \
            "/home/mac/CODING/FlipFlop-production/scripts/start-production-remote.sh"
      - name: Require extension dispatch token
        env:
          EXTENSION_DISPATCH_TOKEN: ${{ secrets.FLIPFLOP_EXTENSION_DISPATCH_TOKEN }}
        run: |
          test -n "$EXTENSION_DISPATCH_TOKEN" || {
            echo "Missing FLIPFLOP_EXTENSION_DISPATCH_TOKEN production secret." >&2
            exit 1
          }
      - name: Build DEV and LIVE extensions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLIPFLOP_EXTENSION_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'galactic-git-me',
              repo: 'FlipFlopXtension',
              event_type: 'flipflop-production-push',
              client_payload: {
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_sha: context.sha
              }
            });
