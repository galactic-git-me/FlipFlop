name: Deploy production to Andromeda

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (must point to main)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY-PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: flipflop-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flipflop_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d flipflop_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    env:
      OLLAMA_MODEL: disabled-in-ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      FLIPFLOP_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
    defaults:
      run:
        working-directory: flipflop-api
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Require explicit confirmation
        if: inputs.confirm != 'DEPLOY-PRODUCTION'
        run: |
          echo "Production deployment requires confirmation value DEPLOY-PRODUCTION."
          exit 1
      - name: Verify release tag is on main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --tags origin main
          test -n "$RELEASE_TAG"
          sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main || {
            echo "Release tag $RELEASE_TAG is not reachable from origin/main." >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flipflop-api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flipflop-admin/package-lock.json
      - name: Install API dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      - name: Verify eBay OAuth and price alerts
        run: >-
          python scripts/run_isolated_tests.py -- -q
          tests/test_ebay_oauth.py
          tests/test_component_price_alert_matching.py

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    env:
      EXTENSION_DISPATCH_TOKEN: ${{ secrets.FLIPFLOP_EXTENSION_DISPATCH_TOKEN }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.ANDROMEDA_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/andromeda
          chmod 600 ~/.ssh/andromeda
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tagged Andromeda services
        env:
          ANDROMEDA_HOST: ${{ secrets.ANDROMEDA_HOST }}
          ANDROMEDA_USER: ${{ secrets.ANDROMEDA_USER }}
          ANDROMEDA_PORT: ${{ secrets.ANDROMEDA_PORT }}
        run: |
          ssh -i ~/.ssh/andromeda \
            -p "${ANDROMEDA_PORT:-22}" \
            "$ANDROMEDA_USER@$ANDROMEDA_HOST" \
            "/home/mac/CODING/FlipFlop-production/deploy/deploy-andromeda.sh '${{ needs.verify-release.outputs.release_sha }}'"
      - name: Build DEV and LIVE extensions
        if: env.EXTENSION_DISPATCH_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLIPFLOP_EXTENSION_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'galactic-git-me',
              repo: 'FlipFlopXtension',
              event_type: 'flipflop-production-push',
              client_payload: {
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_sha: '${{ needs.verify-release.outputs.release_sha }}'
              }
            });
