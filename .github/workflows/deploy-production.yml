name: Deploy production to Andromeda

on:
  push:
    branches: [master]
    paths:
      - "flipflop-api/**"
      - "deploy/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: flipflop-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # The autocommit daemon on Andromeda pushes "chore: sync" commits every
    # 30-60s and frequently touches flipflop-api/** or deploy/**, which would
    # otherwise trigger a full rebuild + container recreate (brief prod
    # downtime) on every autosync instead of only real changes. Manual
    # workflow_dispatch runs (no head_commit) are never skipped.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: sync') }}"
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: disabled-in-ci
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
    defaults:
      run:
        working-directory: flipflop-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flipflop-api/requirements*.txt
      - name: Install API dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      - name: Verify eBay OAuth and price alerts
        run: >-
          python -m pytest -q
          tests/test_ebay_oauth.py
          tests/test_component_price_alert_matching.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.ANDROMEDA_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/andromeda
          chmod 600 ~/.ssh/andromeda
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          ANDROMEDA_HOST: ${{ secrets.ANDROMEDA_HOST }}
          ANDROMEDA_USER: ${{ secrets.ANDROMEDA_USER }}
          ANDROMEDA_PORT: ${{ secrets.ANDROMEDA_PORT }}
        run: |
          ssh -i ~/.ssh/andromeda \
            -p "${ANDROMEDA_PORT:-22}" \
            "$ANDROMEDA_USER@$ANDROMEDA_HOST" \
            "/home/mac/CODING/FlipFlop-production/deploy/deploy-andromeda.sh '${{ github.sha }}'"
