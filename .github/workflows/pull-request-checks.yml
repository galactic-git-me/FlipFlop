name: Pull request checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flipflop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flipflop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OLLAMA_MODEL: disabled-in-ci
      FLIPFLOP_CI_FULL_API_TESTS: "1"
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
      STRIPE_SECRET_KEY: sk_test_flipflop_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_flipflop_ci_only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipflop_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_test
      TEST_DATABASE_SCHEMA: flipflop_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Report commit received on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "::notice title=LIVE promotion merged::[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] GitHub pushed main commit $GITHUB_SHA; release tagging waits for successful source parity and repository checks."
      - name: Wait for exact DEV runtime deployment before LIVE promotion
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@v7
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const timestamp = () => new Date().toISOString();
            const expectedSha = process.env.PR_HEAD_SHA;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({
                ...context.repo,
                ref: expectedSha,
                per_page: 100,
              });
              const deployment = data.check_runs.find((check) => check.name === 'DEV deployment');
              if (deployment?.status === 'completed') {
                if (deployment.conclusion !== 'success') {
                  core.setFailed(`[${timestamp()}] DEV deployment for ${expectedSha} concluded ${deployment.conclusion}.`);
                  return;
                }
                core.notice(`[${timestamp()}] Exact DEV deployment check passed for ${expectedSha}.`);
                return;
              }
              core.info(`[${timestamp()}] Waiting for DEV deployment check for ${expectedSha} (attempt ${attempt}/60).`);
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }
            core.setFailed(`[${timestamp()}] Timed out waiting for exact DEV deployment check on ${expectedSha}.`);
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce DEV-first promotion
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet origin dev:refs/remotes/origin/dev main:refs/remotes/origin/main
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            bash scripts/verify-dev-source-parity.sh origin/dev "$PR_HEAD_SHA"
            python scripts/verify-dev-schema-attestation.py \
              --release-ref "$PR_HEAD_SHA" --dev-ref origin/dev --require-dev-ancestor
          fi
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            bash scripts/verify-dev-source-parity.sh origin/dev "$GITHUB_SHA"
            python scripts/verify-dev-schema-attestation.py \
              --release-ref "$GITHUB_SHA" --dev-ref origin/dev --require-dev-ancestor
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flipflop-admin/package-lock.json
      - name: Run repository checks
        shell: bash
        run: bash scripts/ci.sh

  tag-live-release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Tag the validated DEV promotion commit
        uses: actions/github-script@v7
        env:
          FLIPFLOP_DEV_MERGE_TOKEN: ${{ secrets.FLIPFLOP_DEV_MERGE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.FLIPFLOP_DEV_MERGE_TOKEN }}
          script: |
            const timestamp = () => new Date().toISOString();
            const notice = (message) => core.notice(`[${timestamp()}] ${message}`);
            if (!process.env.FLIPFLOP_DEV_MERGE_TOKEN) {
              core.setFailed(`[${timestamp()}] FLIPFLOP_DEV_MERGE_TOKEN is required to create a release tag that triggers LIVE deployment.`);
              return;
            }
            notice(`Main received promotion commit ${process.env.RELEASE_SHA}; checking the merged DEV-to-main PR before creating the LIVE release tag.`);
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: process.env.RELEASE_SHA,
            });
            const promotion = prs.find((pr) => pr.merged_at && pr.base.ref === 'main' && pr.head.ref === 'dev');
            if (!promotion) {
              notice(`No merged DEV-to-main promotion PR is associated with ${process.env.RELEASE_SHA}; no release tag created.`);
              return;
            }
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo,
              per_page: 100,
            });
            const versions = tags
              .map((tag) => /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag.name))
              .filter(Boolean)
              .map((match) => ({
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3]),
              }))
              .sort((a, b) => b.major - a.major || b.minor - a.minor || b.patch - a.patch);
            const latest = versions[0] || { major: 1, minor: 0, patch: -1 };
            const nextTag = `v${latest.major}.${latest.minor}.${latest.patch + 1}`;
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${nextTag}`,
              sha: process.env.RELEASE_SHA,
            });
            notice(`Created ${nextTag} at ${process.env.RELEASE_SHA}; tag-triggered release verification and LIVE deployment will run.`);
