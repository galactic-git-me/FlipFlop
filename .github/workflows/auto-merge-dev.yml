name: Auto-queue eligible DEV pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FLIPFLOP_DEV_MERGE_TOKEN: ${{ secrets.FLIPFLOP_DEV_MERGE_TOKEN }}
    steps:
      - name: Enable GitHub auto-merge
        if: env.FLIPFLOP_DEV_MERGE_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.FLIPFLOP_DEV_MERGE_TOKEN }}
          script: |
            const timestamp = () => new Date().toISOString();
            const notice = (message) => core.notice(`[${timestamp()}] ${message}`);
            const pullRequestNumber = context.payload.pull_request.number;
            const sourceBranch = context.payload.pull_request.head.ref;
            const sourceSha = context.payload.pull_request.head.sha;
            notice(`DEV merge requested: PR #${pullRequestNumber}, ${sourceBranch} @ ${sourceSha}.`);
            let pullRequest;
            for (let attempt = 0; attempt < 5; attempt += 1) {
              const response = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              pullRequest = response.data;
              if (pullRequest.mergeable !== null) break;
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }

            if (pullRequest.mergeable_state === 'dirty' || pullRequest.mergeable === false) {
              notice(`DEV merge pending: PR #${pullRequestNumber} has conflicts; resolve them and update the PR.`);
              return;
            }
            if (pullRequest.mergeable_state === 'behind') {
              notice(`DEV merge pending: PR #${pullRequestNumber} must be updated with the latest dev branch.`);
              return;
            }
            if (pullRequest.mergeable === null) {
              notice(`DEV merge pending: GitHub has not computed mergeability for PR #${pullRequestNumber}; retry after updating or reopening it.`);
              return;
            }

            const pullRequestId = context.payload.pull_request.node_id;
            if (pullRequest.auto_merge) {
              notice(`DEV auto-merge is already queued for PR #${pullRequestNumber}; GitHub will merge it after required checks pass.`);
              return;
            }

            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: MERGE
                }) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId },
            );
            notice(`DEV auto-merge queued for PR #${pullRequestNumber} at ${pullRequest.head.sha}; GitHub will merge it after required checks pass.`);

      - name: Explain missing merge token
        if: env.FLIPFLOP_DEV_MERGE_TOKEN == ''
        run: echo "::warning::[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] DEV auto-merge was not queued because FLIPFLOP_DEV_MERGE_TOKEN is missing. No GitHub merge was attempted."
