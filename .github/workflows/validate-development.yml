name: Validate development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flipflop-development
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flipflop_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d flipflop_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLLAMA_MODEL: disabled-in-ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      FLIPFLOP_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flipflop-api/requirements*.txt
      - name: Install API dependencies
        working-directory: flipflop-api
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      - name: Run development API checks
        working-directory: flipflop-api
        run: python scripts/run_isolated_tests.py -- -q tests/test_ebay_oauth.py tests/test_component_price_alert_matching.py
      - name: Build development admin bundle
        working-directory: flipflop-admin
        run: npm ci && npm run build
