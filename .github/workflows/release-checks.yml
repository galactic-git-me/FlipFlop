name: Release checks

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flipflop_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d flipflop_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLLAMA_MODEL: disabled-in-ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flipflop_release_test
      FLIPFLOP_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EBAY_TOKEN_ENCRYPTION_KEY: ci-only-ebay-token-encryption-test-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flipflop-admin/package-lock.json
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Require tag on main
        id: tag_check
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force --tags origin main:refs/remotes/origin/main
          git rev-parse "$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main || {
            echo "Release tag is not reachable from origin/main." >&2
            exit 1
          }
          sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require a production pull request with passing DEV parity
        id: dev_promotion
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.tag_check.outputs.sha }}
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.RELEASE_SHA,
            });
            const promotion = prs.find((pr) => pr.merged_at && pr.base.ref === 'main');
            if (!promotion) {
              core.setFailed('Release commit must be merged through a production pull request.');
              return;
            }
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_SHA,
              per_page: 100,
            });
            const passedGate = checks.check_runs.some((check) =>
              check.name === 'checks' && check.conclusion === 'success' && check.app.slug === 'github-actions'
            );
            if (!passedGate) {
              core.setFailed('Release commit lacks a passing DEV-source parity and repository checks run.');
            }
      - name: Run repository checks
        shell: bash
        run: bash scripts/ci.sh
