name: Clean up merged branch worktree

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: merged-worktree-cleanup-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, Windows, flipflop-coding-cleanup]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Remove the exact clean merged branch worktree
        shell: pwsh
        env:
          FLIPFLOP_WORKTREE_REPO: ${{ vars.FLIPFLOP_WORKTREE_REPO }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $repositoryRoot = $env:FLIPFLOP_WORKTREE_REPO
          if ([string]::IsNullOrWhiteSpace($repositoryRoot)) {
            $repositoryRoot = Join-Path $env:USERPROFILE 'CODING\FlipFlop'
          }
          & "$env:GITHUB_WORKSPACE\scripts\cleanup-merged-branch-worktree.ps1" `
            -RepositoryRoot $repositoryRoot `
            -TargetBranch $env:TARGET_BRANCH `
            -SourceBranch $env:SOURCE_BRANCH `
            -SourceSha $env:SOURCE_SHA
