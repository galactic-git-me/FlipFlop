services:
  frontend:
    build:
      context: ./pc-flipper
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm run dev -- -p 3000 -H 0.0.0.0"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
      # Forces Next.js to use polling instead of inotify — required on Linux
      # containers where inotify events from volume mounts are unreliable.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./pc-flipper:/app
      - /app/node_modules
      - /app/.next

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5
    volumes:
      - ./pc-flipper-backend:/app
