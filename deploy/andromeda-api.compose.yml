services:
  postgres:
    image: postgres:18-alpine
    container_name: flipflop-production-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_DB: pcflipper
      POSTGRES_USER: flipper
      POSTGRES_PASSWORD: flipper
    volumes:
      - flipflop_production_postgres:/var/lib/postgresql
    networks:
      - flipflop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipper -d pcflipper"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: flipflop-production-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - flipflop_production_redis:/data
    networks:
      - flipflop-network

  ollama-tunnel:
    image: alpine:3.20
    container_name: flipflop-production-ollama-tunnel
    restart: unless-stopped
    command: ["/bin/sh", "-c", "apk add --no-cache openssh-client && exec ssh -N -T -g -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -L 0.0.0.0:11434:127.0.0.1:11434 mclar@prometheus-ts"]
    volumes:
      - /home/mac/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /home/mac/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    networks:
      - flipflop-network

  api:
    build:
      context: ../flipflop-api
      dockerfile: Dockerfile
      target: backend
    container_name: flipflop-production-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: ../.env.local
        required: true
      # Developer-local API overrides are gitignored and are not present in
      # the production checkout. Production secrets live in ../.env.local.
      - path: ../flipflop-api/.env
        required: false
    environment:
      APP_ENV: production
      WEB_ONLY: "true"
      DATABASE_URL: postgresql+asyncpg://flipper:flipper@postgres:5432/pcflipper
      SYNC_DATABASE_URL: postgresql://flipper:flipper@postgres:5432/pcflipper
      REDIS_URL: redis://redis:6379/0
      # The SSH reverse tunnel exposes Prometheus' Ollama on Andromeda's host
      # port 11434. Containers must use the host gateway rather than their own
      # localhost namespace.
      # The web tier does not run CPK/scoring; Ollama is connected only to the
      # GemRadar worker through the tunnel sidecar below.
      OLLAMA_BASE_URL: ""
      OLLAMA_MODEL: disabled-on-web-tier
      FRONTEND_URL: https://www.theflipflop.shop
      # Live listings must never silently fall back to the eBay sandbox when
      # the host env file omits this optional setting.
      EBAY_LISTING_ENVIRONMENT: production
      # OAuth is completed by the local admin UI in the operator's browser.
      ADMIN_FRONTEND_URL: http://localhost:4312
      EBAY_OAUTH_CALLBACK_URL: https://www.theflipflop.shop/api/ebay/oauth/callback
      EBAY_PRODUCTION_PAYMENT_POLICY_ID: "298501538014"
      EBAY_PRODUCTION_RETURN_POLICY_ID: "298501571014"
      EBAY_PRODUCTION_FULFILLMENT_POLICY_ID: "298928779014"
    ports:
      - "127.0.0.1:4311:4311"
    networks:
      - flipflop-network
    volumes:
      - ../runtime/builds:/builds
      - ../runtime/api-data:/app/data
      - ../runtime/uploads:/app/data/uploads
      - ../runtime/scrapes:/app/scrapes
      - ../runtime/fb-profile:/app/.fb-profile
      - ../runtime/fb_cookies.json:/app/fb_cookies.json
      - ../runtime/public-media:/FlipFlop.shop/public/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4311/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Keep queue processing separate from the web tier. The API intentionally
  # runs WEB_ONLY=true, so this service is the process that claims and drains
  # extension submissions from submission_queue.
  gemradar-worker:
    build:
      context: ../flipflop-api
      dockerfile: Dockerfile
      target: backend
    container_name: flipflop-production-gemradar-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama-tunnel:
        condition: service_started
    env_file:
      - path: ../.env.local
        required: true
      - path: ../flipflop-api/.env
        required: false
    environment:
      APP_ENV: production
      WEB_ONLY: "false"
      DATABASE_URL: postgresql+asyncpg://flipper:flipper@postgres:5432/pcflipper
      SYNC_DATABASE_URL: postgresql://flipper:flipper@postgres:5432/pcflipper
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      EBAY_LISTING_ENVIRONMENT: production
      # Was capped at 2 (config.py default) as an emergency throttle during a
      # past RAM-pressure incident. Confirmed 2026-09-07: 16GiB available,
      # no OOM history, no crash-loop — raising to 4 as a conservative first
      # step (the previous cap of 2 left 13 of 15 queue workers idle whenever
      # a backlog spanned more than 2 distinct search terms).
      MAX_CONCURRENT_SEARCH_TERMS: "4"
    command: ["uvicorn", "app.gem_radar_standalone:app", "--host", "0.0.0.0", "--port", "8000"]
    network_mode: service:ollama-tunnel
    volumes:
      - ../runtime/builds:/builds
      - ../runtime/api-data:/app/data
      - ../runtime/uploads:/app/data/uploads
      - ../runtime/scrapes:/app/scrapes
      - ../runtime/fb-profile:/app/.fb-profile
      - ../runtime/fb_cookies.json:/app/fb_cookies.json
      - ../runtime/public-media:/FlipFlop.shop/public/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  flipflop_production_postgres:
  flipflop_production_redis:

networks:
  flipflop-network:
    driver: bridge
