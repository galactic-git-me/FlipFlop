              - generic [ref=f3e489]:
                - generic [ref=f3e490]: Ownership
                - generic [ref=f3e491]: Can I upgrade it later?
                - generic [ref=f3e492]: Yes. It uses standard desktop components wherever the specification allows. Compatibility, available slots, power requirements and case clearance should be checked before any upgrade.
            - generic [ref=f3e493] [cursor=pointer]:
              - 'checkbox "Include FAQ: Are the photographs of the actual PC?" [checked] [ref=f3e494]'
              - generic [ref=f3e495]:
                - generic [ref=f3e496]: Condition
                - generic [ref=f3e497]: Are the photographs of the actual PC?
                - generic [ref=f3e498]: Yes. The build photographs show the actual completed machine unless an image is clearly labelled as an illustration or 3D view.
            - generic [ref=f3e499] [cursor=pointer]:
              - 'checkbox "Include FAQ: Are all of the components new?" [checked] [ref=f3e500]'
              - generic [ref=f3e501]:
                - generic [ref=f3e502]: Condition
                - generic [ref=f3e503]: Are all of the components new?
                - generic [ref=f3e504]: The exact condition is disclosed in the listing. Any component that was opened, tested or previously owned is identified rather than being represented as factory-sealed.
            - generic [ref=f3e505] [cursor=pointer]:
              - 'checkbox "Include FAQ: How is the PC packaged for delivery?" [ref=f3e506]'
              - generic [ref=f3e507]:
                - generic [ref=f3e508]: Delivery
                - generic [ref=f3e509]: How is the PC packaged for delivery?
                - generic [ref=f3e510]: The PC is secured with protective packaging designed to limit movement and protect the case. The buyer should remove any clearly marked internal transit protection before switching it on.
            - generic [ref=f3e511] [cursor=pointer]:
              - 'checkbox "Include FAQ: How long will delivery take?" [ref=f3e512]'
              - generic [ref=f3e513]:
                - generic [ref=f3e514]: Delivery
                - generic [ref=f3e515]: How long will delivery take?
                - generic [ref=f3e516]: Ready-to-ship PCs normally have one working day handling followed by an estimated one to two working day tracked delivery window. Any different build lead time is shown before purchase.
            - generic [ref=f3e517] [cursor=pointer]:
              - 'checkbox "Include FAQ: Will I receive tracking information?" [ref=f3e518]'
              - generic [ref=f3e519]:
                - generic [ref=f3e520]: Delivery
                - generic [ref=f3e521]: Will I receive tracking information?
                - generic [ref=f3e522]: Yes. Tracking is provided after dispatch when the courier booking has been completed.
            - generic [ref=f3e523] [cursor=pointer]:
              - 'checkbox "Include FAQ: What should I do if it arrives damaged?" [ref=f3e524]'
              - generic [ref=f3e525]:
                - generic [ref=f3e526]: Delivery
                - generic [ref=f3e527]: What should I do if it arrives damaged?
                - generic [ref=f3e528]: Keep all packaging, photograph the parcel and PC before further handling, and contact FlipFlop promptly. Do not attempt a repair before receiving guidance.
            - generic [ref=f3e529] [cursor=pointer]:
              - 'checkbox "Include FAQ: Can I return the PC?" [checked] [ref=f3e530]'
              - generic [ref=f3e531]:
                - generic [ref=f3e532]: Returns
                - generic [ref=f3e533]: Can I return the PC?
                - generic [ref=f3e534]: The applicable returns period is shown with the product. For a change of mind the customer pays return postage; FlipFlop pays reasonable return costs when goods are faulty, damaged or misdescribed. Statutory rights are unaffected.
            - generic [ref=f3e535] [cursor=pointer]:
              - 'checkbox "Include FAQ: What warranty or consumer protection do I receive?" [checked] [ref=f3e536]'
              - generic [ref=f3e537]:
                - generic [ref=f3e538]: Support
                - generic [ref=f3e539]: What warranty or consumer protection do I receive?
                - generic [ref=f3e540]: UK statutory consumer rights apply. Any remaining transferable manufacturer warranty is identified with the build; no unsupported manufacturer cover is implied.
            - generic [ref=f3e541] [cursor=pointer]:
              - 'checkbox "Include FAQ: Can you help me set it up?" [ref=f3e542]'
              - generic [ref=f3e543]:
                - generic [ref=f3e544]: Support
                - generic [ref=f3e545]: Can you help me set it up?
                - generic [ref=f3e546]: Yes. Direct setup and troubleshooting support is available after purchase, including help with first connection and common configuration questions.
            - generic [ref=f3e547] [cursor=pointer]:
              - 'checkbox "Include FAQ: How noisy is the PC?" [checked] [ref=f3e548]'
              - generic [ref=f3e549]:
                - generic [ref=f3e550]: Performance
                - generic [ref=f3e551]: How noisy is the PC?
                - generic [ref=f3e552]: Noise varies with workload, room temperature and fan settings. The system is configured for stable everyday operation, but no fixed decibel claim is made unless it has been measured and published.
            - generic [ref=f3e553] [cursor=pointer]:
              - 'checkbox "Include FAQ: What gaming performance should I expect?" [checked] [ref=f3e554]'
              - generic [ref=f3e555]:
                - generic [ref=f3e556]: Performance
                - generic [ref=f3e557]: What gaming performance should I expect?
                - generic [ref=f3e558]: Use the measured results shown for this build where available. Frame rates also depend on the game, resolution, settings, updates and background software.
            - generic [ref=f3e559] [cursor=pointer]:
