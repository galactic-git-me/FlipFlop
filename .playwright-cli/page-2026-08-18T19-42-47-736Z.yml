              - generic [ref=f3e561]:
                - generic [ref=f3e562]: Included
                - generic [ref=f3e563]: Is a monitor, keyboard or mouse included?
                - generic [ref=f3e564]: Only the items explicitly listed in the included-items section and photographs are supplied. A monitor and peripherals are not assumed to be included.
            - generic [ref=f3e565] [cursor=pointer]:
              - 'checkbox "Include FAQ: Are the original component boxes included?" [ref=f3e566]'
              - generic [ref=f3e567]:
                - generic [ref=f3e568]: Included
                - generic [ref=f3e569]: Are the original component boxes included?
                - generic [ref=f3e570]: Only packaging shown or explicitly listed is included. Large original boxes may be omitted where they cannot be shipped safely with the completed PC.
            - generic [ref=f3e571] [cursor=pointer]:
