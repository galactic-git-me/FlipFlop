                - generic [ref=f3e467]: Is the PC ready to use when it arrives?
                - generic [ref=f3e468]: Yes. Windows, drivers and available updates are installed, and the completed PC is tested before dispatch. You only need to connect your display, keyboard, mouse and internet.
