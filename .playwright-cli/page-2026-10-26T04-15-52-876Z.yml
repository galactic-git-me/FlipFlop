                      - generic [ref=e2478]:
                        - paragraph [ref=e2479]: An excellent, good quality motherboard (especially for the price). A nice surprise was that the BIOS had already been updated to work with new AMD Ryzen 5000 series CPUs "out of the box", saving the need to flash (i.e. update) the BIOS first. Even if I had to, one of the reasons I bought this board was that it has a physical button (at the back) to easily flash the BIOS (i.e. using only a power connection and a USB stick with the update on it). Another reason was the built-in Wifi and Bluetooth support, which both work fine.
                        - paragraph [ref=e2480]: Tinkering with the BIOS settings is very easy. There are one-click buttons to overlock the CPU and to enable XMP (XMP enables RAM to run at maximum speed; factory defaults for 3200Mhz RAM is only about 2200Mhz without XMP enabled, for example). Excel-style graphs you can click also make it very easy to use the mouse to configure and set fan speeds. I've also used the "M-Flash" button to flash (update) the BIOS twice with no problems.
                        - paragraph [ref=e2481]: The MSI website provides all the latest BIOS updates and board drivers needed. MSI were also responsive and helpful when I contacted them about problems getting one of the system fans to work. Turns out one of my cable connections was loose (i.e. nothing wrong with the board or BIOS settings). Very happy with this board.
