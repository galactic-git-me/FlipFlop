                        - paragraph [ref=e2430]: OK so it's not the best 500 series board out there but the 5 star rating is simply because of value for what's included - two M.2 slots for your NVME drives, Wifi, a USB-C header (check your case has a USB-C port - if not just leave it unplugged), two 3 pin RGB headers, and two 4 pin RGB headers,.
                        - paragraph [ref=e2431]: Oh and it has 5 fan headers, which would be enough for most people I would think.
                        - paragraph [ref=e2432]: And while I have only installed low power CPU's like 3600 and 5600 on it, according to Hardware Unboxed it also handles more powerful chips surprisingly well considering how light it looks. Superb board!
                        - paragraph [ref=e2433]: I should also add that I only installed NVME drives in this board, no SATA SSD's so I can't speak for how well placed the SATA headers are if you had a long graphics card installed, but just from looking at it I'm guessing you would be fine, especially as they are side mounted and not front mounted like a different motherboard I recently worked with, which was a pain
