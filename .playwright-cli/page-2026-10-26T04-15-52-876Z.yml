                      - generic [ref=e2712]:
                        - paragraph [ref=e2713]: Keep in mind, if you install a newer generation AMD processor then before you do anything with this motherboard, plug in the 24 pin power supply and the 8 pin CPU power, don't put anything on the board, just the power. Get yourself a USB stick and download the latest motherboard bios file and put it on the stick, there are many videos out there to help you out, and flash the BIOS (install the bios update), while it is plugged in to ONLY the power supply, don't put your cpu, ram, gpu anything on the board and let it do it's thing and update.
                        - paragraph [ref=e2714]: Once it is updated, proceed to install your components. I speak from firsthand experience when I say that I installed all my components and the PC would simply not turn on and I spent a day trying to fix it, when it turned out to be a very simple problem to fix. So save yourself the hard work of having to remove the components and do the flashing afterwards, do it beforehand and things will be much simpler.
                        - paragraph [ref=e2715]: No complaints other than that so far, has plenty of ports, can support only DDR4 RAM, and has only 1 PCIE Gen 4 slot for an SSD, but at this price, it really is the best you can get!
