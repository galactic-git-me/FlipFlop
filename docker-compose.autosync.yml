services:
  repo-watcher:
    build:
      context: ./autosync
    container_name: coding-repo-watcher
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CODING_DIR: /coding
      INTERVAL_SECONDS: 300
      COMMIT_MSG_PREFIX: "chore: automated codebase synchronization"
      PRIMARY_REPO: FlipFlop
      GIT_USER_NAME: Coding AutoSync
      GIT_USER_EMAIL: autosync@coding.local
      TZ: Europe/London
      HOME: /home/mac
      GIT_CONFIG_GLOBAL: /tmp/.gitconfig
    volumes:
      - /home/mac/CODING:/coding
      - /home/mac/.git-credentials:/home/mac/.git-credentials
