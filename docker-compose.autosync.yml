services:
  coding-git-sync:
    build:
      context: ./autosync
    container_name: coding-git-sync
    restart: unless-stopped
    environment:
      CODING_DIR: /coding
      INTERVAL_SECONDS: 300
      COMMIT_MSG_PREFIX: "chore: automated codebase synchronization"
      GIT_USER_NAME: Coding AutoSync
      GIT_USER_EMAIL: autosync@coding.local
      TZ: Europe/London
    volumes:
      - /home/mac/CODING:/coding
      - /home/mac/.git-credentials:/root/.git-credentials:ro
