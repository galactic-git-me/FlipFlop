services:
  # Ollama - GPU-accelerated LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: flipflop-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=-1
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 10 && ollama pull qwen2:7b && wait"

volumes:
  ollama_data:
    driver: local
