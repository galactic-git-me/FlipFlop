services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcflipper
      POSTGRES_USER: flipper
      POSTGRES_PASSWORD: flipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipper -d pcflipper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host port matches the dev instance's port (run_dev.py --port 4311)
      # so every consumer (storefront rewrites, the FlipFlopXtension scraper)
      # can target one consistent port regardless of how the API is started.
      - "4311:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://flipper:flipper@db:5432/pcflipper
      SYNC_DATABASE_URL: postgresql://flipper:flipper@db:5432/pcflipper
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
