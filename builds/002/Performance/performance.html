<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Card</title>
<style>
  @font-face{
    font-family:"Nasa";
    src:url("assets/Nasa.ttf") format("truetype");
    font-display:swap;
  }

  :root{
    --bg:#050608;
    --bg-panel:#0b0d12;
    --bg-tile:#11141b;
    --line:rgba(150,180,220,0.10);
    --line-strong:rgba(150,180,220,0.20);
    --ink:#eef2f7;
    --ink-dim:#93a0b3;
    --ink-faint:#5c6779;
    --blue:#2f7bff;
    --blue-soft:#7fb0ff;
    --orange:#ff7a1a;
    --orange-soft:#ffb066;
    --good:#4ade80;
    --gold:#ffc94d;
  }

  *{box-sizing:border-box;}
  .display{font-family:"Nasa", "Segoe UI", sans-serif; letter-spacing:0.02em;}

  @keyframes driftA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4vw,3vh) scale(1.08);}}
  @keyframes driftB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-4vw,-2vh) scale(1.1);}}
  @keyframes shimmer{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    justify-content:center;
    padding:40px 16px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;}
  body::before{background:radial-gradient(46vw 46vw at 8% 38%, color-mix(in srgb, var(--orange) 46%, transparent) 0%, color-mix(in srgb, var(--orange) 20%, transparent) 45%, transparent 72%);animation:driftA 16s ease-in-out infinite;}
  body::after{background:radial-gradient(46vw 46vw at 96% 46%, color-mix(in srgb, var(--blue) 46%, transparent) 0%, color-mix(in srgb, var(--blue) 20%, transparent) 45%, transparent 72%);animation:driftB 18s ease-in-out infinite;}
  .card{position:relative;z-index:1;width:100%;max-width:820px;background:var(--bg-panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 40px 110px -30px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.02);}

  .loader{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.7s ease, visibility 0.7s ease;}
  .loader video{width:min(56vw, 230px);height:auto;border-radius:18px;box-shadow:0 0 70px -10px color-mix(in srgb, var(--orange) 45%, transparent), 0 0 70px -10px color-mix(in srgb, var(--blue) 35%, transparent);}
  .loader .loader-text{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-faint);font-family:"Nasa", sans-serif;}
  .loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){
    .loader{display:none;}
    body::before, body::after, .grad-text, .gauge-fill, .rc-fill{animation:none !important;}
  }

  .mono{font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;}
  .grad-text{background:linear-gradient(95deg, var(--orange-soft), var(--blue-soft), var(--orange-soft));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite;}

  /* build picture */
  .build-picture{margin:0 40px 20px;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .build-picture img{display:block;width:100%;height:auto;max-height:300px;object-fit:cover;}

  /* masthead */
  .masthead{position:relative;padding:32px 40px 30px;background:radial-gradient(70% 140% at 0% 10%, color-mix(in srgb, var(--orange) 34%, transparent), transparent 70%),radial-gradient(70% 140% at 100% 30%, color-mix(in srgb, var(--blue) 34%, transparent), transparent 70%),var(--bg-panel);border-bottom:1px solid var(--line);overflow:hidden;}
  .brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .full-logo{display:block;height:clamp(130px, 21vw, 170px);width:auto;object-fit:contain;margin:-32px 0 -28px -30px;}
  .page-title{margin-top:18px;font-size:clamp(26px, 5vw, 34px);font-weight:400;letter-spacing:0.03em;text-transform:uppercase;}
  .badge-verified{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--good);border:1px solid color-mix(in srgb, var(--good) 45%, transparent);background:color-mix(in srgb, var(--good) 12%, transparent);padding:5px 10px 5px 8px;border-radius:999px;white-space:nowrap;}
  .badge-verified .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .model-row{margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .build-name{font-size:clamp(13px, 2.4vw, 15px);font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--orange-soft);margin-bottom:4px;}
  .model-name{font-size:clamp(15px, 2.6vw, 18px);font-weight:600;letter-spacing:0.01em;text-wrap:balance;color:var(--ink);font-family:"Segoe UI", sans-serif;}
  .model-sub{margin-top:8px;font-size:13px;color:var(--ink-dim);font-family:"Segoe UI", sans-serif;}
  .hero-score{text-align:right;}
  .hero-score .stars-top{font-size:28px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 10px color-mix(in srgb, var(--gold) 45%, transparent);display:block;margin-bottom:8px;font-weight:bold;}
  .hero-score .num{font-size:clamp(36px, 6.6vw, 50px);font-weight:400;line-height:1;font-variant-numeric: tabular-nums;}
  .hero-score .lbl{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:4px;}
  .hero-score .pct{margin-top:6px;font-size:12px;font-weight:700;color:var(--good);font-family:"Segoe UI", sans-serif;}

  /* tool strip */
  .toolstrip{padding:10px 40px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:10.5px;color:var(--ink-faint);border-bottom:1px solid var(--line);background:var(--bg-panel);}
  .toolstrip .ts-label{text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--ink-dim);margin-right:2px;}
  .toolstrip .ts-tool{padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg-tile);color:var(--ink-dim);font-weight:600;}

  /* tier badges */
  .tier{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;width:fit-content;}
  .tier::before{content:"";width:5px;height:5px;border-radius:50%;}
  .tier.excellent{color:var(--gold);background:color-mix(in srgb, var(--gold) 14%, transparent);border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);}
  .tier.excellent::before{background:var(--gold);}
  .tier.great{color:var(--blue-soft);background:color-mix(in srgb, var(--blue) 16%, transparent);border:1px solid color-mix(in srgb, var(--blue) 40%, transparent);}
  .tier.great::before{background:var(--blue-soft);}
  .tier.good{color:var(--ink-dim);background:color-mix(in srgb, var(--ink-faint) 16%, transparent);border:1px solid var(--line-strong);}
  .tier.good::before{background:var(--ink-dim);}

  /* section label */
  .section{padding:26px 40px 8px;}
  .section-label{font-size:12px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:10px;}
  .section-label::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:linear-gradient(180deg, var(--orange), var(--blue));}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* percentile hero */
  .percentile{margin:14px 40px 0;padding:20px 22px;border-radius:16px;border:1px solid var(--line-strong);background:radial-gradient(120% 220% at 0% 50%, color-mix(in srgb, var(--orange) 16%, transparent), transparent 60%),radial-gradient(120% 220% at 100% 50%, color-mix(in srgb, var(--blue) 16%, transparent), transparent 60%),var(--bg-tile);display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .percentile .num-block{flex:none;text-align:center;}
  .percentile .num-block .big{font-size:56px;font-weight:400;line-height:1;}
  .percentile .num-block .suffix{font-size:12px;color:var(--ink-faint);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
  .percentile .body{flex:1;min-width:220px;}
  .percentile .headline{font-size:15px;font-weight:700;color:var(--ink);text-wrap:balance;}
  .percentile .sub{font-size:11.5px;color:var(--ink-dim);margin-top:3px;}
  .percentile .gauge{margin-top:12px;position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid var(--line);overflow:hidden;}
  .percentile .gauge-fill{position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg, var(--orange), var(--blue));}
  .percentile .gauge-marks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-faint);margin-top:4px;}

  /* rank charts */
  .rankgrid{padding:16px 40px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .rankcard{background:var(--bg-tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;}
  .rankcard .rc-title{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;}
  .rc-row{display:grid;grid-template-columns: 92px 1fr 34px;align-items:center;gap:7px;padding:2.5px 0;}
  .rc-row .rc-label{font-size:9.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rc-row.me .rc-label{color:var(--ink);font-weight:700;}
  .rc-track{height:6px;border-radius:999px;background:rgba(255,255,255,0.05);overflow:hidden;}
  .rc-fill{height:100%;border-radius:999px;background:color-mix(in srgb, var(--ink-faint) 55%, transparent);}
  .rc-row.me .rc-fill{background:linear-gradient(90deg, var(--orange), var(--blue));}
  .rc-row .rc-val{font-size:9.5px;text-align:right;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .rc-row.me .rc-val{color:var(--ink);font-weight:700;}
  .rankgrid-foot{margin:8px 40px 0;font-size:10px;color:var(--ink-faint);line-height:1.4;}

  /* score distribution */
  .distcard{margin:16px 40px 0;padding:16px 18px 14px;background:var(--bg-tile);border:1px solid var(--line);border-radius:14px;}
  .distcard .dc-title{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);}
  .distcard .dc-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .distchart{width:100%;height:auto;display:block;margin-top:10px;}

  /* benchmark grid */
  .grid{padding:14px 40px 6px;display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;}
  .tile{position:relative;background:var(--bg-tile);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .tile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, var(--orange), var(--blue));opacity:0.6;}
  .tile .tag{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;font-family:"Segoe UI", sans-serif;}
  .tile .val{font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric: tabular-nums;color:var(--ink);}
  .tile .val span{font-size:13px;font-weight:600;color:var(--ink-dim);margin-left:2px;}
  .tile .ctx{font-size:11.5px;color:var(--ink-dim);margin-top:5px;line-height:1.4;font-family:"Segoe UI", sans-serif;}
  .tile.accent-blue .val{color:var(--blue-soft);}
  .tile.accent-orange .val{color:var(--orange-soft);}
  .tiernote{margin:2px 40px 0;font-size:10.5px;color:var(--ink-faint);}

  /* games poster grid */
  .games{padding:14px 40px 6px;display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;}
  .game-card{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid var(--line-strong);isolation:isolate;}
  .game-card .art{position:absolute;inset:0;}
  .game-card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;}
  .game-card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,6,8,0.05) 0%, rgba(5,6,8,0.35) 45%, rgba(5,6,8,0.94) 88%),linear-gradient(0deg, color-mix(in srgb, var(--blue) 18%, transparent), transparent 55%),linear-gradient(180deg, color-mix(in srgb, var(--orange) 14%, transparent), transparent 45%);}
  .game-card .content{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 11px;z-index:2;}
  .game-card .stars{font-size:11px;letter-spacing:1px;margin-bottom:4px;display:inline-block;background:linear-gradient(90deg,var(--gold) 0%, var(--gold) var(--pct, 100%),rgba(255,255,255,0.28) var(--pct, 100%), rgba(255,255,255,0.28) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px color-mix(in srgb, var(--gold) 45%, transparent));}
  .game-card .title{font-size:12px;font-weight:700;color:#fff;line-height:1.25;text-wrap:balance;font-family:"Segoe UI", sans-serif;}
  .game-card .fps-row{margin-top:4px;display:flex;align-items:baseline;gap:4px;}
  .game-card .fps-num{font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;font-size:19px;font-weight:700;color:var(--gold);font-variant-numeric: tabular-nums;}
  .game-card .fps-unit{font-size:10px;font-weight:700;color:rgba(255,255,255,0.65);text-transform:uppercase;}
  .games-foot{margin:8px 40px 0;padding:9px 14px;font-size:10.5px;color:var(--ink-faint);background:var(--bg-tile);border:1px solid var(--line);border-radius:10px;font-family:"Segoe UI", sans-serif;}

  /* everyday performance */
  .everyday{margin:14px 40px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .ed-row{display:grid;grid-template-columns: auto 1fr auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);}
  .ed-row:first-child{border-top:none;}
  .ed-icon{flex:none;width:20px;height:20px;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;}
  .ed-icon svg{width:100%;height:100%;stroke-width:2;}
  .ed-row .ed-name{font-size:13px;font-weight:600;color:var(--ink);}
  .ed-row .ed-note{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .ed-row .tier{margin-top:0;}

  /* spec strip */
  .specs{margin:22px 40px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .spec-row{display:grid;grid-template-columns: 150px 1fr;border-top:1px solid var(--line);}
  .spec-row:first-child{border-top:none;}
  .spec-row .k{padding:11px 14px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;background:color-mix(in srgb, var(--bg-tile) 60%, transparent);display:flex;align-items:center;gap:8px;font-family:"Segoe UI", sans-serif;}
  .spec-row .k svg{flex:none;width:15px;height:15px;color:var(--ink-faint);}
  .spec-row .v{padding:11px 14px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;font-family:"Segoe UI", sans-serif;}

  /* health strip */
  .health{margin:16px 40px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb, var(--good) 35%, var(--line));background:color-mix(in srgb, var(--good) 7%, var(--bg-tile));font-family:"Segoe UI", sans-serif;}
  .health .pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:var(--good);}
  .health .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent);}
  .health .mid{font-size:12px;color:var(--ink-dim);display:flex;gap:18px;flex-wrap:wrap;}
  .health .mid b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .health .drive{font-size:11.5px;color:var(--ink-faint);text-align:right;font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;}

  /* footer */
  .footer{margin-top:24px;padding:18px 40px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:"Segoe UI", sans-serif;}
  .footer .note{font-size:11px;color:var(--ink-faint);max-width:480px;line-height:1.5;}
  .footer .stamp{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);text-align:right;white-space:nowrap;font-family:"Nasa", sans-serif;}

  @media (max-width:560px){
    .grid{grid-template-columns:repeat(2, 1fr);}
    .games{grid-template-columns:repeat(2, 1fr);}
    .masthead, .section, .footer, .toolstrip{padding-left:22px;padding-right:22px;}
    .grid, .games{padding-left:22px;padding-right:22px;}
    .games-foot, .specs, .health, .tiernote, .everyday{margin-left:22px;margin-right:22px;}
    .hero-score{text-align:left;}
    .model-row{align-items:flex-start;}
    .percentile{margin-left:22px;margin-right:22px;}
    .rankgrid{grid-template-columns:1fr;padding-left:22px;padding-right:22px;}
    .rankgrid-foot{margin-left:22px;margin-right:22px;}
    .distcard{margin-left:22px;margin-right:22px;}
  }
</style>
</head>
<body>

<div class="loader" id="ffLoader">
  <video autoplay muted playsinline loop src="assets/hero-loop.mp4"></video>
  <div class="loader-text">Loading performance report…</div>
</div>

<div class="card" id="ffCard"><!-- populated by render.js --></div>

<script src="render.js?v=20260805"></script>
</body>
</html>
