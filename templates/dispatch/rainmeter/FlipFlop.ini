[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=7,17,31,220
CornerRadius=18
AntiAlias=1

[Variables]
BuildName={{BUILD_NAME}}
Accent=103,220,255
Text=235,244,255
Muted=153,177,199

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y

[MeterBrand]
Meter=String
X=28
Y=24
FontFace=Segoe UI Semibold
FontSize=11
FontColor=#Accent
AntiAlias=1
Text=FLIPFLOP  /  BUILT AROUND YOU

[MeterBuild]
Meter=String
X=28
Y=55
W=520
H=62
FontFace=Segoe UI Semibold
FontSize=25
FontColor=#Text
AntiAlias=1
ClipString=1
Text=#BuildName#

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=28
Y=142
FontFace=Segoe UI Light
FontSize=34
FontColor=#Text
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=31
Y=190
FontFace=Segoe UI
FontSize=10
FontColor=#Muted
AntiAlias=1

[MeterPortal]
Meter=String
X=31
Y=235
FontFace=Segoe UI Semibold
FontSize=11
FontColor=#Accent
AntiAlias=1
Text={{PORTAL_LABEL}}
{{PORTAL_ACTION}}
ToolTipText=View build details, care guide and support
